<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<link rel="preload" href="slopkit/cat.jpg" as="image">
<link rel="preload" href="slopkit/mmhmm-cats-ps5.gif" as="image">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(circle at 50% 28%, #18233a 0, #0c111b 44%, #07090e 100%);
    color: #c8ced8;
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    overflow-x: hidden;
    overflow-y: auto;
  }
  #wrap {
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
    padding: 30px 0;
    box-sizing: border-box;
  }
  #cat {
    box-sizing: border-box; width: 130px; height: 130px; object-fit: cover;
    max-width: 34vw; max-height: 34vw;
    border: 4px solid #343c49; border-radius: 18px;
    box-shadow: 0 24px 70px rgba(0,0,0,.5);
  }

  #actions {
    display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center;
    width: 280px;
  }
  .action {
    box-sizing: border-box; display: inline-block; width: 100%;
    padding: 14px 20px; border: 1px solid rgba(255,255,255,.22);
    border-radius: 15px; color: #fff;
    background: linear-gradient(135deg, #3b8cff, #1957c8);
    box-shadow: 0 12px 30px rgba(18,79,190,.32), inset 0 1px rgba(255,255,255,.22);
    font: 700 18px/1 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .025em; text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }

  .action:focus {
    outline: none; transform: translateY(-3px);
    border-color: #fff; box-shadow: 0 0 0 4px rgba(91,158,255,.3), 0 16px 36px rgba(18,79,190,.45);
  }
  .action:active { transform: translateY(1px); }
  
  .action.kstuff {
    background: linear-gradient(135deg, #e67e22, #d35400);
    box-shadow: 0 12px 30px rgba(211,84,0,.32);
  }
  
  .action.secondary {
    color: #eaf2ff; background: linear-gradient(135deg, #273850, #172235);
    box-shadow: 0 12px 30px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.12);
  }

  #status { min-height: 1.5em; color: #9fb1c3; font-size: 18px; text-align: center; }
  @media (max-width: 650px) {
    #actions { width: 82vw; }
  }
</style>
</head>
<body>

<div id="wrap">
  <img id="cat" src="slopkit/cat.jpg" alt="">
  
  <div id="actions">
    <!-- زر التهكيرة الأساسي -->
    <a id="start" class="action"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"
       tabindex="0">RUN EXPLOIT</a>

    <!-- زراير البايلودات اللي رفعيتها -->
    <a class="action kstuff" href="slopkit/poops.html?go=1&amp;auto=1&amp;payload=payloads/kstuff.elf">KSTUFF</a>
    <a class="action secondary" href="slopkit/poops.html?go=1&amp;auto=1&amp;payload=payloads/shadowmountplus.elf">SHADOW MOUNT PLUS</a>
    <a class="action secondary" href="slopkit/poops.html?go=1&amp;auto=1&amp;payload=payloads/websrv-ps5.elf">WEB SERVER</a>
    <a class="action secondary" href="slopkit/poops.html?go=1&amp;auto=1&amp;payload=payloads/ftpsrv-ps5.elf">FTP SERVER</a>
    <a class="action secondary" href="slopkit/poops.html?go=1&amp;auto=1&amp;payload=payloads/elfldr-ps5-1360.elf">ELF LOADER</a>
  </div>

  <div id="status"></div>
</div>

<script>
try {
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("cat").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}
</script>

</body>
</html>
